<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0f13">
<title>Sprachbot</title>
<style>
:root{
  --bg:#0d0f13; --bg2:#141821; --bg3:#1c2230;
  --txt:#e8ecf3; --dim:#8b95a7; --acc:#4f8cff; --acc2:#7c5cff;
  --bot:#171c26; --me:#2a4c8f; --line:#232a38;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--txt);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
header{
  display:flex;align-items:center;gap:10px;padding:10px 14px;
  border-bottom:1px solid var(--line);background:rgba(13,15,19,.92);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
header h1{font-size:16px;font-weight:600;margin:0;flex:1;letter-spacing:.2px}
header h1 span{color:var(--acc);}
.iconbtn{
  width:38px;height:38px;border-radius:11px;border:1px solid var(--line);
  background:var(--bg2);color:var(--txt);font-size:17px;display:grid;place-items:center;
  cursor:pointer;transition:.15s;
}
.iconbtn:active{transform:scale(.92);background:var(--bg3)}
#chat{flex:1;overflow-y:auto;padding:16px 14px 8px;-webkit-overflow-scrolling:touch}
.msg{max-width:88%;padding:11px 14px;border-radius:16px;margin-bottom:12px;white-space:pre-wrap;word-wrap:break-word;animation:in .22s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.bot{background:var(--bot);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.me{background:var(--me);margin-left:auto;border-bottom-right-radius:5px}
.msg.bot strong{color:#fff}
.msg.bot code{background:#000;padding:1px 5px;border-radius:5px;font-size:14px}
.msg.sys{background:transparent;border:1px dashed var(--line);color:var(--dim);font-size:13px;max-width:100%;text-align:center;margin:0 auto 12px}
#composer{
  display:flex;align-items:flex-end;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);background:rgba(20,24,33,.96);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
#input{
  flex:1;resize:none;max-height:130px;min-height:44px;padding:11px 14px;border-radius:14px;
  border:1px solid var(--line);background:var(--bg);color:var(--txt);font:inherit;outline:none;
}
#input:focus{border-color:var(--acc)}
#mic,#send{width:46px;height:46px;border-radius:14px;border:none;font-size:20px;display:grid;place-items:center;cursor:pointer;transition:.15s}
#mic{background:var(--bg3);color:var(--txt)}
#mic.rec{background:#e0453f;color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(224,69,63,.6)}50%{box-shadow:0 0 0 12px rgba(224,69,63,0)}}
#send{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
#send:disabled{opacity:.4}
button:active{transform:scale(.94)}
#panel{
  position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:none;
  align-items:flex-end;backdrop-filter:blur(4px);
}
#panel.open{display:flex}
#sheet{
  width:100%;max-height:82%;overflow-y:auto;background:var(--bg2);
  border-radius:20px 20px 0 0;padding:20px 18px calc(26px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);
}
#sheet h2{margin:0 0 16px;font-size:17px}
.row{margin-bottom:16px}
.row label{display:block;font-size:13px;color:var(--dim);margin-bottom:6px}
.row select,.row input[type=text],.row textarea{
  width:100%;padding:11px;border-radius:11px;border:1px solid var(--line);
  background:var(--bg);color:var(--txt);font:inherit;outline:none;
}
.row textarea{min-height:80px;resize:vertical}
.row input[type=range]{width:100%;accent-color:var(--acc)}
.sw{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}
.sw span{font-size:15px}
.sw input{width:50px;height:30px;appearance:none;background:var(--bg3);border-radius:20px;position:relative;transition:.2s;cursor:pointer}
.sw input:checked{background:var(--acc)}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked::after{left:23px}
.ghost{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--txt);font:inherit;cursor:pointer}
</style>
</head>
<body>

<header>
  <h1>Sprach<span>bot</span></h1>
  <button class="iconbtn" id="newBtn" title="Neu">＋</button>
  <button class="iconbtn" id="setBtn" title="Einstellungen">⚙</button>
</header>

<div id="chat"></div>

<div id="composer">
  <button id="mic" title="Sprechen">🎙</button>
  <textarea id="input" rows="1" placeholder="Sprechen oder tippen …"></textarea>
  <button id="send" disabled>➤</button>
</div>

<div id="panel">
  <div id="sheet">
    <h2>Einstellungen</h2>

    <div class="row">
      <label>Modell</label>
      <select id="modelSel">
        <option value="openai">openai (ausgewogen)</option>
        <option value="mistral">mistral (schnell)</option>
        <option value="llama">llama</option>
        <option value="searchgpt">searchgpt (Web-Suche)</option>
      </select>
    </div>

    <div class="sw"><span>Internet-Zugriff (Live-Suche)</span><input type="checkbox" id="netSw"></div>
    <div class="sw"><span>Antworten vorlesen</span><input type="checkbox" id="ttsSw" checked></div>
    <div class="sw"><span>Gesprächsmodus (Mic danach wieder an)</span><input type="checkbox" id="loopSw"></div>

    <div class="row" style="margin-top:16px">
      <label>Stimme</label>
      <select id="voiceSel"></select>
    </div>

    <div class="row">
      <label>Sprechtempo: <b id="rateVal">1.0</b></label>
      <input type="range" id="rate" min="0.6" max="1.6" step="0.1" value="1">
    </div>

    <div class="row">
      <label>Spracheingabe</label>
      <select id="langSel">
        <option value="de-DE">Deutsch</option>
        <option value="en-US">English</option>
        <option value="fr-FR">Français</option>
        <option value="es-ES">Español</option>
        <option value="it-IT">Italiano</option>
      </select>
    </div>

    <div class="row">
      <label>System-Prompt (Charakter)</label>
      <textarea id="sysPrompt" placeholder="Du bist ein hilfsbereiter Assistent …"></textarea>
    </div>

    <button class="ghost" id="closeBtn">Fertig</button>
  </div>
</div>

<script>
"use strict";

/* ---------- Konstanten ---------- */
const API_POST = "https://text.pollinations.ai/openai";
const API_GET  = "https://text.pollinations.ai/";
const LS = "sprachbot.v1";
const MAX_HISTORY = 16;

/* ---------- State ---------- */
const state = {
  history: [],
  model: "openai",
  net: false,
  tts: true,
  loop: false,
  rate: 1,
  lang: "de-DE",
  voice: "",
  sys: "Du bist ein freundlicher, kompetenter Sprachassistent. Antworte kurz, klar und auf den Punkt, damit man dir gut zuhören kann. Keine Aufzählungen mit Sonderzeichen.",
  busy: false
};

const $ = id => document.getElementById(id);
const chat = $("chat"), input = $("input"), sendBtn = $("send"), micBtn = $("mic");

/* ---------- Persistenz ---------- */
function save(){
  try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem(LS);
    if(raw) Object.assign(state, JSON.parse(raw));
  }catch(e){}
}
load();

/* ---------- UI-Helfer ---------- */
function addMsg(text, who){
  const d = document.createElement("div");
  d.className = "msg " + who;
  if(who === "bot"){
    d.innerHTML = md(text);
  } else {
    d.textContent = text;
  }
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}
function md(t){
  return t
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/```([\s\S]*?)```/g,(m,c)=>'<code>'+c+'</code>')
    .replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
    .replace(/`([^`]+)`/g,"<code>$1</code>");
}
function plain(t){
  return t.replace(/```[\s\S]*?```/g," ")
          .replace(/[*_`#>]/g,"")
          .replace(/\[(.*?)\]\(.*?\)/g,"$1")
          .replace(/\s+/g," ").trim();
}

/* ---------- Sprachausgabe ---------- */
let unlocked = false;
function speak(text){
  if(!state.tts || !text.trim()) { onSpeakEnd(); return; }
  const u = new SpeechSynthesisUtterance(plain(text).slice(0, 900));
  u.lang = state.lang;
  u.rate = state.rate;
  const v = speechSynthesis.getVoices().find(x => x.name === state.voice);
  if(v) u.voice = v;
  u.onend = onSpeakEnd;
  u.onerror = onSpeakEnd;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}
function onSpeakEnd(){
  if(state.loop && !state.busy) setTimeout(() => { if(!recActive) startRec(); }, 350);
}

/* ---------- Spracherkennung ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, recActive = false;

function startRec(){
  if(!SR){ addMsg("Spracherkennung wird von diesem Browser nicht unterstützt. Tippe stattdessen.", "sys"); return; }
  if(recActive) return;
  speechSynthesis.cancel();
  rec = new SR();
  rec.lang = state.lang;
  rec.continuous = false;
  rec.interimResults = true;
  rec.onstart = () => { recActive = true; micBtn.classList.add("rec"); };
  rec.onerror = e => {
    recActive = false; micBtn.classList.remove("rec");
    if(e.error === "not-allowed") addMsg("Mikrofon-Zugriff verweigert. In den Einstellungen erlauben.", "sys");
  };
  rec.onend = () => { recActive = false; micBtn.classList.remove("rec"); };
  rec.onresult = ev => {
    let txt = "";
    for(let i = ev.resultIndex; i < ev.results.length; i++){
      txt += ev.results[i][0].transcript;
    }
    input.value = txt.trim();
    autosize();
    if(ev.results[ev.results.length - 1].isFinal){
      recActive = false;
      micBtn.classList.remove("rec");
      const t = input.value.trim();
      if(t) send(t);
    }
  };
  try{ rec.start(); }catch(e){}
}
function stopRec(){
  if(rec){ try{ rec.stop(); }catch(e){} }
  recActive = false; micBtn.classList.remove("rec");
}

/* ---------- API ---------- */
function activeModel(){
  if(state.net) return "searchgpt";
  return state.model;
}
function buildMessages(){
  const sys = state.sys + (state.net
    ? "\n\nNutze aktiv aktuelle Websuche-Ergebnisse und nenne kurz die Quellen."
    : "");
  const msgs = [{ role: "system", content: sys }];
  const hist = state.history.slice(-MAX_HISTORY);
  for(const m of hist) msgs.push(m);
  return msgs;
}

async function streamChat(msgs, onDelta){
  const res = await fetch(API_POST, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ model: activeModel(), messages: msgs, stream: true })
  });
  if(!res.ok || !res.body) throw new Error("HTTP " + res.status);
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = "";
  while(true){
    const { done, value } = await reader.read();
    if(done) break;
    buf += dec.decode(value, { stream: true });
    const chunks = buf.split("\n\n");
    buf = chunks.pop();
    for(const c of chunks){
      for(const line of c.split("\n")){
        if(!line.startsWith("data:")) continue;
        const d = line.slice(5).trim();
        if(!d || d === "[DONE]") continue;
        try{
          const j = JSON.parse(d);
          const t = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
          if(t) onDelta(t);
        }catch(e){}
      }
    }
  }
}

async function simpleChat(msgs){
  const prompt = msgs.map(m => (m.role === "assistant" ? "Assistent: " : m.role === "system" ? "" : "User: ") + m.content).join("\n\n");
  const url = API_GET + encodeURIComponent(prompt) + "?model=" + encodeURIComponent(activeModel());
  const res = await fetch(url);
  if(!res.ok) throw new Error("HTTP " + res.status);
  return await res.text();
}

/* ---------- Senden ---------- */
async function send(text){
  if(state.busy) return;
  text = text.trim();
  if(!text) return;

  state.busy = true;
  sendBtn.disabled = true;
  input.value = "";
  autosize();
  stopRec();
  speechSynthesis.cancel();

  addMsg(text, "me");
  state.history.push({ role: "user", content: text });

  const bubble = addMsg("", "bot");
  let full = "";

  try{
    const msgs = buildMessages();
    try{
      await streamChat(msgs, t => {
        full += t;
        bubble.innerHTML = md(full);
        chat.scrollTop = chat.scrollHeight;
      });
    }catch(err){
      full = await simpleChat(msgs);
      bubble.innerHTML = md(full);
    }
  }catch(err){
    full = "Fehler: " + err.message + " — Verbindung prüfen.";
    bubble.innerHTML = md(full);
  }

  if(!full.trim()){
    full = "(keine Antwort)";
    bubble.innerHTML = md(full);
  }

  state.history.push({ role: "assistant", content: full });
  state.busy = false;
  sendBtn.disabled = !input.value.trim();
  save();
  speak(full);
}

/* ---------- Events ---------- */
function autosize(){
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 130) + "px";
  sendBtn.disabled = !input.value.trim() || state.busy;
}
input.addEventListener("input", autosize);
input.addEventListener("keydown", e => {
  if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(input.value); }
});
sendBtn.addEventListener("click", () => send(input.value));
micBtn.addEventListener("click", () => {
  if(recActive){ stopRec(); }
  else { unlocked = true; startRec(); }
});

/* ---------- Einstellungen ---------- */
function openPanel(){
  $("modelSel").value = state.model;
  $("netSw").checked = state.net;
  $("ttsSw").checked = state.tts;
  $("loopSw").checked = state.loop;
  $("langSel").value = state.lang;
  $("rate").value = state.rate;
  $("rateVal").textContent = Number(state.rate).toFixed(1);
  $("sysPrompt").value = state.sys;
  $("panel").classList.add("open");
}
$("setBtn").addEventListener("click", openPanel);
$("closeBtn").addEventListener("click", () => $("panel").classList.remove("open"));
$("panel").addEventListener("click", e => { if(e.target.id === "panel") $("panel").classList.remove("open"); });

$("modelSel").addEventListener("change", e => { state.model = e.target.value; save(); });
$("netSw").addEventListener("change", e => { state.net = e.target.checked; save(); });
$("ttsSw").addEventListener("change", e => { state.tts = e.target.checked; if(!state.tts) speechSynthesis.cancel(); save(); });
$("loopSw").addEventListener("change", e => { state.loop = e.target.checked; save(); });
$("langSel").addEventListener("change", e => { state.lang = e.target.value; fillVoices(); save(); });
$("rate").addEventListener("input", e => { state.rate = parseFloat(e.target.value); $("rateVal").textContent = state.rate.toFixed(1); save(); });
$("sysPrompt").addEventListener("input", e => { state.sys = e.target.value; save(); });

function fillVoices(){
  const sel = $("voiceSel");
  sel.innerHTML = "";
  const voices = speechSynthesis.getVoices().filter(v => v.lang.startsWith(state.lang.slice(0,2)));
  if(!voices.length){
    const o = document.createElement("option");
    o.value = ""; o.textContent = "Standard";
    sel.appendChild(o);
    return;
  }
  for(const v of voices){
    const o = document.createElement("option");
    o.value = v.name; o.textContent = v.name;
    if(v.name === state.voice) o.selected = true;
    sel.appendChild(o);
  }
  if(!state.voice) state.voice = voices[0].name;
}
$("voiceSel").addEventListener("change", e => { state.voice = e.target.value; save(); });
if(speechSynthesis) speechSynthesis.onvoiceschanged = fillVoices;
fillVoices();

/* ---------- Neuer Chat ---------- */
$("newBtn").addEventListener("click", () => {
  if(state.busy) return;
  speechSynthesis.cancel();
  state.history = [];
  chat.innerHTML = "";
  addMsg("Neuer Chat gestartet.", "sys");
  save();
});

/* ---------- Start ---------- */
if(state.history.length){
  for(const m of state.history){
    addMsg(m.content, m.role === "user" ? "me" : "bot");
  }
} else {
  addMsg("Tippe auf 🎙 und sprich, oder schreibe unten. Internet-Zugriff und Stimme lassen sich über ⚙ einstellen.", "sys");
}
autosize();
</script>
</body>
</html>
